<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="circleGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  
  <!-- Abstract blockchain nodes -->
  <g filter="url(#glow)">
    <circle cx="300" cy="200" r="40" fill="url(#circleGradient)"/>
    <circle cx="500" cy="350" r="60" fill="url(#circleGradient)"/>
    <circle cx="800" cy="250" r="50" fill="url(#circleGradient)"/>
    <circle cx="400" cy="550" r="45" fill="url(#circleGradient)"/>
    <circle cx="700" cy="600" r="55" fill="url(#circleGradient)"/>
    <circle cx="900" cy="450" r="35" fill="url(#circleGradient)"/>
  </g>
  
  <!-- Connecting lines -->
  <g stroke="#ff6b35" stroke-width="2" stroke-opacity="0.2">
    <line x1="300" y1="200" x2="500" y2="350"/>
    <line x1="500" y1="350" x2="800" y2="250"/>
    <line x1="800" y1="250" x2="700" y2="600"/>
    <line x1="700" y1="600" x2="400" y2="550"/>
    <line x1="400" y1="550" x2="900" y2="450"/>
    <line x1="900" y1="450" x2="300" y2="200"/>
  </g>
  
  <!-- Ethereum/EVM hexagons -->
  <g stroke="#ff6b35" stroke-width="1" stroke-opacity="0.3" fill="none">
    <polygon points="600,100 650,150 600,200与他们 550,150" transform="translate(0, 0)"/>
    <polygon points="1000,300 1050,350 1000,400 950,350" transform="translate(0, 0)"/>
    <polygon points="200,500 250,550 200,600 150,550" transform="translate(0, 0)"/>
  </g>
</svg>
