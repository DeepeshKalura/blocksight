    services:
      db:
        image: postgres:17-alpine
        environment:
          - POSTGRES_USER=${POSTGRES_USER}
          - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          - POSTGRES_DB=${POSTGRES_DB}
        ports:
          - "${POSTGRES_PORT}:5432"
        volumes:
          - app-db-data:/var/lib/postgresql/data

    volumes:
      app-db-data: